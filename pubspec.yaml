name: quiz_app
description: "A flashcard quiz app for studying"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  hive_flutter: ^1.1.0

  provider: ^6.1.1

  go_router: ^13.0.0

  google_fonts: ^6.1.0

  cupertino_icons: ^1.0.6

  intl: ^0.18.1
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true